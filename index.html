<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- description -->
        <meta
            name="description"
            content="Adquiere licencias e impresiones de fotografía artística exclusiva. Alta calidad en arquitectura histórica medieval, arte y escenas de la vida diaria."
        />

        <!-- son 14 palabras, pero 6 palabras clave técnicamente, keywords de cola larga 'long-tail keywords' -->
        <!-- keywords -->
        <meta
            name="keywords"
            content="fotografia artistica, fotografia de autor, licencias de imagenes, impresiones de arte, comprar fotografias, licencia editorial"
        />
        <meta name="robots" content="index, follow" />

        <!-- open graph -->
        <meta
            property="og:title"
            content="Portafolio Artístico | Venta de Licencias e Impresiones"
        />
        <meta
            property="og:description"
            content="Adquiere licencias e impresiones de fotografía artística exclusiva. Alta calidad en arquitectura histórica medieval, arte y escenas de la vida diaria."
        />
        <meta
            property="og:image"
            content="https://bodyofwork.netlify.app/og-hero.webp"
        />

        <!-- título -->
        <title>Portafolio Artístico | Venta de Licencias e Impresiones</title>

        <!-- Preload critical LCP hero image -->
        <link
            rel="preload"
            href="./src/assets/hero.webp"
            as="image"
            fetchpriority="high"
        />

        <!-- preconnect - fuentes e íconos -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Material+Symbols+Outlined&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
